<style>
  :root{
    --bg1:#0f1a12; --bg2:#1b2e1f; --leaf:#5fd068; --leaf-dk:#2f8f3a;
    --clay:#d9764a; --halo:#ffd76a; --text:#f3f7ee; --muted:#b9c9b4;
    --card:rgba(255,255,255,.06); --card-hover:rgba(95,208,104,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; font-family:'Nunito',system-ui,sans-serif; color:var(--text);
    background:radial-gradient(ellipse at top,var(--bg2),var(--bg1) 70%) fixed;
    display:flex; justify-content:center; padding:48px 16px 32px; overflow-x:hidden;
  }
  /* floating leaves */
  .leaf{position:fixed;font-size:28px;opacity:.18;animation:float 14s linear infinite;pointer-events:none}
  @keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
  main{width:100%;max-width:440px;text-align:center;position:relative;z-index:1}
  .avatar{width:230px;height:230px;margin:-20px auto 4px;position:relative;isolation:isolate}
  .avatar::before{content:'';position:absolute;inset:7.2%;border-radius:50%;z-index:-1;box-shadow:0 0 18px 4px rgba(120,255,140,.5),0 0 44px 10px rgba(120,255,140,.25);animation:breathe 12s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 18px 4px rgba(120,255,140,.5),0 0 44px 10px rgba(120,255,140,.25)}50%{box-shadow:0 0 30px 9px rgba(120,255,140,.85),0 0 70px 20px rgba(120,255,140,.4)}}
  .avatar img{width:100%;height:100%;display:block}
  h1{font-family:'Bungee',cursive;font-size:30px;letter-spacing:1px;
     background:linear-gradient(90deg,var(--halo),var(--leaf),var(--halo),var(--leaf));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tone 18s linear infinite}
  @keyframes tone{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){h1,.avatar::before{animation:none}}
  .tag{color:var(--muted);margin:6px 0 4px;font-size:15px}
  .bio{font-size:15px;margin-bottom:26px;white-space:nowrap}
  .links{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;
    background:var(--card);border:1px solid rgba(255,255,255,.1);color:var(--text);
    text-decoration:none;font-weight:800;font-size:16px;
    transition:transform .15s,background .15s,border-color .15s;
  }
  .btn:hover,.btn:focus-visible{transform:translateY(-2px) scale(1.01);background:var(--card-hover);border-color:var(--leaf)}
  .btn .ic{width:28px;height:28px;flex:none;background:var(--c,#fff);
    -webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
  .btn span.lbl{flex:1;text-align:left}
  .btn small{color:var(--muted);font-weight:600;font-size:13px}
  .feature{background:linear-gradient(90deg,rgba(217,118,74,.25),rgba(95,208,104,.18));border-color:var(--clay)}
  .feature .emoji{font-size:26px;width:28px;text-align:center}
  .live{background:linear-gradient(90deg,rgba(145,70,255,.3),rgba(145,70,255,.1));border-color:#9146ff}
  .dot{width:9px;height:9px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.3}}
  footer{margin-top:30px;color:var(--muted);font-size:13px}
  footer b{font-family:'Bungee',cursive;color:var(--leaf);font-weight:400}
</style>
